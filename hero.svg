<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Anubhav Jain animated developer console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="55%" stop-color="#111425"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill:#8b93a7; }
    .white { fill:#f6f7fb; }
    .purple { fill:#c084fc; }
    .cyan { fill:#67e8f9; }
    .green { fill:#86efac; }
    .line1 { opacity:0; animation:show .35s .5s forwards; }
    .line2 { opacity:0; animation:show .35s 1.15s forwards; }
    .line3 { opacity:0; animation:show .35s 1.8s forwards; }
    .line4 { opacity:0; animation:show .35s 2.45s forwards; }
    .line5 { opacity:0; animation:show .35s 3.1s forwards; }
    .pill1 { opacity:0; transform:translateY(8px); animation:rise .45s 3.5s forwards; }
    .pill2 { opacity:0; transform:translateY(8px); animation:rise .45s 3.75s forwards; }
    .pill3 { opacity:0; transform:translateY(8px); animation:rise .45s 4s forwards; }
    .pill4 { opacity:0; transform:translateY(8px); animation:rise .45s 4.25s forwards; }
    .cursor { animation:blink .8s steps(1,end) infinite; }
    .scan { animation:scan 5s linear infinite; }
    .pulse { animation:pulse 2s ease-in-out infinite; transform-origin:center; }
    .node1 { animation:node 2.6s ease-in-out infinite; }
    .node2 { animation:node 2.6s .4s ease-in-out infinite; }
    .node3 { animation:node 2.6s .8s ease-in-out infinite; }
    @keyframes show { to { opacity:1; } }
    @keyframes rise { to { opacity:1; transform:translateY(0); } }
    @keyframes blink { 0%,48% {opacity:1} 49%,100% {opacity:0} }
    @keyframes scan { from { transform:translateY(-120px)} to { transform:translateY(520px)} }
    @keyframes pulse { 0%,100% {opacity:.45} 50% {opacity:1} }
    @keyframes node { 0%,100% {opacity:.35} 50% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; opacity:1 !important; transform:none !important; }
    }
  </style>

  <rect x="0" y="0" width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#30364a"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" filter="url(#glow)"/>

  <circle cx="36" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="32" r="6" fill="#febc2e"/>
  <circle cx="80" cy="32" r="6" fill="#28c840"/>
  <text x="102" y="38" class="mono muted" font-size="14">anubhav@profile:~/agent-lab</text>
  <text x="1085" y="38" class="mono green" font-size="13">SYSTEM ONLINE</text>
  <circle cx="1065" cy="33" r="5" fill="#22c55e" class="pulse"/>

  <text x="46" y="102" class="sans white" font-size="44" font-weight="800">ANUBHAV JAIN</text>
  <text x="47" y="132" class="mono purple" font-size="17" letter-spacing="2">AI FELLOW / SOFTWARE ENGINEER</text>

  <g class="mono" font-size="16">
    <text x="48" y="180" class="line1"><tspan class="cyan">$</tspan><tspan class="white"> init coding-agent-evaluation</tspan></text>
    <text x="48" y="211" class="line2"><tspan class="muted">[01]</tspan><tspan class="white"> repository environment </tspan><tspan class="green">READY</tspan></text>
    <text x="48" y="242" class="line3"><tspan class="muted">[02]</tspan><tspan class="white"> deterministic verifier </tspan><tspan class="green">READY</tspan></text>
    <text x="48" y="273" class="line4"><tspan class="muted">[03]</tspan><tspan class="white"> reasoning trace </tspan><tspan class="cyan">ANALYZING</tspan></text>
    <text x="48" y="304" class="line5"><tspan class="muted">[04]</tspan><tspan class="white"> accepted benchmark tasks </tspan><tspan class="purple">200+</tspan></text>
    <text x="48" y="344" class="line5"><tspan class="cyan">$</tspan><tspan class="white"> ship --reproducible --tested</tspan><tspan class="cursor white">_</tspan></text>
  </g>

  <g transform="translate(760,92)">
    <rect width="390" height="250" rx="18" fill="#0d1020" stroke="#2e3550"/>
    <text x="26" y="36" class="mono muted" font-size="13">AGENT EVAL PIPELINE</text>

    <line x1="74" y1="90" x2="195" y2="90" stroke="#4b5563" stroke-width="2"/>
    <line x1="195" y1="90" x2="316" y2="90" stroke="#4b5563" stroke-width="2"/>
    <line x1="316" y1="90" x2="316" y2="170" stroke="#4b5563" stroke-width="2"/>
    <line x1="316" y1="170" x2="195" y2="170" stroke="#4b5563" stroke-width="2"/>
    <line x1="195" y1="170" x2="74" y2="170" stroke="#4b5563" stroke-width="2"/>

    <circle cx="74" cy="90" r="13" fill="#7c3aed" class="node1"/>
    <circle cx="195" cy="90" r="13" fill="#c026d3" class="node2"/>
    <circle cx="316" cy="90" r="13" fill="#22d3ee" class="node3"/>
    <circle cx="316" cy="170" r="13" fill="#22c55e" class="node1"/>
    <circle cx="195" cy="170" r="13" fill="#7c3aed" class="node2"/>
    <circle cx="74" cy="170" r="13" fill="#c026d3" class="node3"/>

    <text x="52" y="121" class="mono muted" font-size="11">TASK</text>
    <text x="168" y="121" class="mono muted" font-size="11">ENV</text>
    <text x="289" y="121" class="mono muted" font-size="11">AGENT</text>
    <text x="287" y="201" class="mono muted" font-size="11">TEST</text>
    <text x="165" y="201" class="mono muted" font-size="11">EVAL</text>
    <text x="48" y="201" class="mono muted" font-size="11">PASS</text>

    <text x="26" y="228" class="mono green" font-size="12">reproducible / deterministic / adversarial</text>
  </g>

  <g class="mono" font-size="13">
    <g class="pill1"><rect x="770" y="360" rx="11" width="80" height="28" fill="#161a2b" stroke="#30364a"/><text x="793" y="379" class="white">Python</text></g>
    <g class="pill2"><rect x="858" y="360" rx="11" width="80" height="28" fill="#161a2b" stroke="#30364a"/><text x="881" y="379" class="white">Docker</text></g>
    <g class="pill3"><rect x="946" y="360" rx="11" width="80" height="28" fill="#161a2b" stroke="#30364a"/><text x="973" y="379" class="white">Git</text></g>
    <g class="pill4"><rect x="1034" y="360" rx="11" width="116" height="28" fill="#161a2b" stroke="#30364a"/><text x="1054" y="379" class="white">LLM Eval</text></g>
  </g>

  <rect x="0" y="-110" width="1200" height="110" fill="url(#scan)" class="scan"/>
</svg>
